<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TUI Terminal Harness</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1e1e1e;
        padding: 12px;
        display: inline-block;
      }
      #terminal {
        display: inline-block;
      }
      .xterm-viewport {
        overflow: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script>
      const content =
        "300  ┤                        \u001b[37m▓▓▓▓▓▓▓\u001b[39m\n     │                        \u001b[37m▓▓▓▓▓▓▓\u001b[39m\n200  ┤\u001b[37m▓▓▓▓▓▓▓\u001b[39m \u001b[37m▓▓▓▓▓▓▓\u001b[39m         \u001b[37m███████\u001b[39m\n     │\u001b[37m███████\u001b[39m \u001b[37m███████\u001b[39m         \u001b[37m███████\u001b[39m\n     │\u001b[37m███████\u001b[39m \u001b[37m███████\u001b[39m \u001b[37m▓▓▓▓▓▓▓\u001b[39m \u001b[37m███████\u001b[39m\n100  ┤\u001b[37m███████\u001b[39m \u001b[37m███████\u001b[39m \u001b[37m███████\u001b[39m \u001b[37m███████\u001b[39m\n     │\u001b[37m███████\u001b[39m \u001b[37m███████\u001b[39m \u001b[37m███████\u001b[39m \u001b[37m███████\u001b[39m\n     │\u001b[37m███████\u001b[39m \u001b[37m███████\u001b[39m \u001b[37m███████\u001b[39m \u001b[37m███████\u001b[39m\n0    └───┬───────┬───────┬───────┬───\n        Q1      Q2      Q3      Q4   \n\n\u001b[37m█\u001b[39m Revenue  \u001b[36m█\u001b[39m Costs  \u001b[37m▓\u001b[39m Profit";

      const terminal = new Terminal({
        fontFamily: '"Monaco", "Menlo", "Consolas", "Courier New", monospace',
        fontSize: 14,
        lineHeight: 1.0,
        letterSpacing: 0,
        theme: {
          background: "#1e1e1e",
          foreground: "#d4d4d4",
          cursor: "#1e1e1e",
          cursorAccent: "#1e1e1e",
          black: "#000000",
          red: "#cd3131",
          green: "#0dbc79",
          yellow: "#e5e510",
          blue: "#2472c8",
          magenta: "#bc3fbc",
          cyan: "#11a8cd",
          white: "#e5e5e5",
          brightBlack: "#666666",
          brightRed: "#f14c4c",
          brightGreen: "#23d18b",
          brightYellow: "#f5f543",
          brightBlue: "#3b8eea",
          brightMagenta: "#d670d6",
          brightCyan: "#29b8db",
          brightWhite: "#e5e5e5",
        },
        allowTransparency: false,
        cursorBlink: false,
        cursorStyle: "bar",
        cursorInactiveStyle: "none",
        disableStdin: true,
        convertEol: true,
      });

      terminal.open(document.getElementById("terminal"));
      terminal.write(content);

      // Resize to fit content after rendering
      setTimeout(() => {
        const buffer = terminal.buffer.active;
        let maxCol = 0;
        let maxRow = 0;

        for (let row = 0; row < buffer.length; row++) {
          const line = buffer.getLine(row);
          if (line) {
            const lineText = line.translateToString(true);
            if (lineText.trim().length > 0) {
              maxRow = row + 1;
              maxCol = Math.max(maxCol, lineText.length);
            }
          }
        }

        terminal.resize(maxCol + 1, maxRow);
        window.TERMINAL_READY = true;
      }, 100);
    </script>
  </body>
</html>
