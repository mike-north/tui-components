<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TUI Terminal Harness</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1e1e1e;
        padding: 12px;
        display: inline-block;
      }
      #terminal {
        display: inline-block;
      }
      /* Override xterm styles for tighter rendering */
      .xterm-viewport {
        overflow: hidden !important;
      }
    </style>
  </head>
  <body>
    <div id="terminal"></div>

    <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
    <script>
      const terminal = new Terminal({
        fontFamily: '"Monaco", "Menlo", "Consolas", "Courier New", monospace',
        fontSize: 14,
        lineHeight: 1.0,
        letterSpacing: 0,
        theme: {
          background: "#1e1e1e",
          foreground: "#d4d4d4",
          cursor: "#1e1e1e", // Hide cursor
          cursorAccent: "#1e1e1e",
          // Standard ANSI colors
          black: "#000000",
          red: "#cd3131",
          green: "#0dbc79",
          yellow: "#e5e510",
          blue: "#2472c8",
          magenta: "#bc3fbc",
          cyan: "#11a8cd",
          white: "#e5e5e5",
          brightBlack: "#666666",
          brightRed: "#f14c4c",
          brightGreen: "#23d18b",
          brightYellow: "#f5f543",
          brightBlue: "#3b8eea",
          brightMagenta: "#d670d6",
          brightCyan: "#29b8db",
          brightWhite: "#e5e5e5",
        },
        allowTransparency: false,
        cursorBlink: false,
        cursorStyle: "bar",
        cursorInactiveStyle: "none",
        disableStdin: true,
        convertEol: true,
      });

      const fitAddon = new FitAddon();
      terminal.loadAddon(fitAddon);
      terminal.open(document.getElementById("terminal"));

      // Get content from URL parameter
      const params = new URLSearchParams(window.location.search);
      const content = params.get("content");

      if (content) {
        // Decode and write to terminal
        const decoded = decodeURIComponent(content);
        terminal.write(decoded);
      }

      // Resize terminal to fit content
      // Wait for content to render, then resize
      setTimeout(() => {
        // Get the actual content dimensions
        const buffer = terminal.buffer.active;
        let maxCol = 0;
        let maxRow = 0;

        for (let row = 0; row < buffer.length; row++) {
          const line = buffer.getLine(row);
          if (line) {
            const lineText = line.translateToString(true);
            if (lineText.trim().length > 0) {
              maxRow = row + 1;
              maxCol = Math.max(maxCol, lineText.length);
            }
          }
        }

        // Resize terminal to fit content (add small padding)
        terminal.resize(maxCol + 2, maxRow + 1);

        // Signal that rendering is complete
        window.TERMINAL_READY = true;
      }, 100);
    </script>
  </body>
</html>
